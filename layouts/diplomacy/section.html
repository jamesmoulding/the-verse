{{ define "main" }}
<div class="wrap with-toc">
  <aside class="toc-wrap">
    <details class="toc" id="toc" open>
      <summary>Contents</summary>
      {{ .TableOfContents }}
      <ul><li><a href="#diplomatic-relation-grid">Diplomatic relation grid</a></li></ul>
    </details>
  </aside>
  <article class="prose">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    {{ .Content }}
    {{ partial "relations.html" . }}
  </article>
</div>
<a class="to-top" href="#toc">Contents ↑</a>
<script>
  if (window.matchMedia("(max-width: 959px)").matches) document.getElementById("toc").removeAttribute("open");
</script>
{{ end }}
