<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "" | relURL }}">THE VERSE <span>Sector 005</span></a>
    <nav aria-label="Main">
      {{- $current := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (eq $current.Section (strings.TrimPrefix "/" .PageRef)) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
