<ul class="factions">
{{- range . }}
  <li>
    <a class="card link faction{{ if not .Params.flag }} no-flag{{ end }}" href="{{ .RelPermalink }}">
      {{ with .Params.flag }}<img src="{{ strings.TrimPrefix "/" . | relURL }}" alt="" loading="lazy">{{ end }}
      <span><strong>{{ .Title }}</strong><small>{{ .Params.kind }}</small></span>
    </a>
  </li>
{{- end }}
</ul>
