{{- /* Returns a page's level-2 headings in document order. */ -}}
{{- $out := slice }}
{{- range .Fragments.Headings }}
  {{- if eq .Level 2 }}{{ $out = $out | append . }}{{ end }}
  {{- range .Headings }}{{ if eq .Level 2 }}{{ $out = $out | append . }}{{ end }}{{ end }}
{{- end }}
{{- return $out }}
