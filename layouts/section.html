{{ define "main" }}
<div class="wrap">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
  <ul class="cards">
  {{ range .Pages.ByWeight }}
    <li><a class="card link" href="{{ .RelPermalink }}"><h2>{{ .Title }}</h2>{{ with .Description }}<p>{{ . }}</p>{{ end }}</a></li>
  {{ end }}
  </ul>
</div>
{{ end }}
