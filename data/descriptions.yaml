# Descriptions shown in the map's info panel, keyed by system name.
# Drawn only from public sources: GNN bulletins, the Game Guide, the Library and Stardata.
# Descriptions that rely on faction sheets are held back until Game Control approves them.

Aeithalis: "A rainforest world."
Amity Station: "An LGR colony centred on the vast Amity Station arcology. Seized and declared under Imperial occupation by Alarian and Federation forces in Turn 8, it saw the bloodiest single engagement of the war so far in orbit the following cycle."
Andor: "A Bionid-infested world. The Andor hive fleet was driven back to the planet's surface by a combined Anti-Bionid Federation fleet in Turn 8, and a SILK-SNG report in Turn 11 declared the hive eliminated."
Assembly: "An LGR world invaded by Federation forces in Turn 8. LGR Governor Hulin keeps her office here."
Bal-D: "A struggling colony riven by a political schism that has threatened economic collapse and abandonment, with the Autarky League leading protests against foreign agents and diplomats on the planet."
Barren Red: "A mining world."
BA17: "A divided colony world of rival colonies, where a Viśvanivāsaḥ Confederacy delegation has brokered talks from Great Wallop."
Brightest Den: "Its people live underground, close to their sun."
Chakravaat: "A world of toxic clouds and constant acid monsoons."
Crashdump: "A SILK world renowned for its raging nightclub scene. The downtown nightclub district and its holo-arena are a fixture of sector-wide tours."
Dalek: "The AFCO Sector 005 capital world. Its three largest cities and the Tribunal and Dockside districts have been the stage for mass protests and a general strike against the Tang administration."
Dragon: "A volcanic world."
Dross: "A large, strikingly biodiverse Class M world bordering Vertinia space, operated by the Vertex Colonial Group. It is home to the Megavox, 40-metre herbivorous reptilian megafauna native to its rich ecosystem."
Earthsea: "Founded in 2375 by the Brydist Great Pilgrimage, Earthsea holds the Book of G'Kar on public display and draws millions of pilgrims to the Order of the Golden Lion. The Delenn Mountains lie on Earthsea."
Felgor: "The Terran colonial capital, with a small moon and fleet repair yards in orbit. Proximan forces raided it in Turn 11, destroying the repair yard and damaging the colonial administration."
Frigid Spring: "A barren and misty world."
Galaga-D: "One of the two worlds hit hardest by the NMVI.00 virus, alongside Tempest Grove."
Gloriana: "The Alarian Imperium's colonial capital in Sector 005, with a primary trade port, a communications grid and naval moorings in orbit. It was struck by an insurgent missile attack in Turn 8 and raided by AFCO's Fifth Fleet in Turn 11."
Grimes Well: "A Cerean Planetary Alliance world where officials have fought black market and mafia activity through the Grimes Well Purge Protocol."
Hades IV: "Headquarters of the CPA-backed Livingstone Mining & Trade Federation, established in Turn 10."
Kahawai: "A world of archipelagos."
Kahurangi: "An archipelago world."
Kedros: "A forest world."
Klendathu: "Infected by the Bionids in 2578, which destroyed the previous colony. The Klendathu Transitional Authority announced the completed removal of Bionid spores from its colonial capital, Bug City, in Turn 1."
Kroot: "An underdeveloped colony first settled by the Imperial Colonisation Bureau, with a small population and a fractious government of competing factions. The Class M planet has multiple continents of largely savannah biomes."
Luna Piena: "Heart of the Solas na Gealaí, where a generational ship arrived through a spatial anomaly in 2260 to found the first interstellar human colony. The SNG fleet anchorage is here."
Mankey: "Completely uninhabited by sentient life, though it sustains a rich arid ecosystem."
Markab: "A world once thought purged of Bionids, where Viśvanivāsaḥ scouts have spotted spores again."
Mollari: "Home of the Mollari Republic and the much smaller Basha Colony on its southern continent. Its equatorial mountainous rainforest belt is the base of the Deep Red insurgency."
Monokoke: "A colony under the Endaron Governing Authority, evacuated after the Bionid emergency on neighbouring Andor."
Moon Weaver: "A world with many moons."
Morana: "Undergoing a magnetic pole shift and an ice age."
New Berlin: "The capital of Le Grande Republique, with orbital dockyards and a planned Museum of Republican Triumph Over Primitive Behaviours."
New Cornwall: "Home of Zserebor University."
New Edinburgh: "Home of the University of New Edinburgh and its Institute of Cyber Historical Studies."
Osquivel: "Rich in rare industrial elements. The SNG orbital arcology Brainsí na gealaí orbits above it, and the Great Hall of Osquivel hosts state occasions."
Parliament: "Home of the Unity 5 orbital station, a joint diplomatic enterprise of the Unity 5 Charter signatories with embassy suites, trading halls and the Grand Plenary assembly chamber."
Polgara: "Above it orbits the Charlotte Marie Station, an SNG orbital arcology renamed in memory of the admiral lost over Skaro."
Potoss-6: "A world in CPA space where the Benzhar of Y5 have asked to found an autonomous colony."
Rakshasa-9: "A beleaguered colony devastated by raiders, now patrolled by the SNG's Mah'alleinir Fleet."
Reason: "The LGR state capital, attacked by two Federation battle squadrons and the First Terran Division in Turn 10."
Riker II: "A war-torn colony shared by two sovereign powers: the democratic Algeron Republic, with its capital Imzadi, and the oligarchic government of Beard."
Rimmer: "Founded in 2452, the Rimmer Archipelago lost contact with the wider sector during the Bionid War."
Sakura: "An SNG world offering refugees land and a fast track to citizenship in exchange for helping develop the planet."
Selidor: "Home of the Selidor Celestial Gardens, venue of the inaugural Fivervision Song Contest."
Sirx Siricius: "Home of the Seekers' elite, invitation-only auction rarities rooms."
Sirx Soter: "Home of the Seekers' bustling general markets and the Galactic Auction House."
Skaro: "An ancient relic world with a deep gravity well, under strict Alarian quarantine. The Promethean artifact here sent an intense beam of radiation towards distant coordinates beyond human settled space."
Squideen: "A new SILK colony world whose infrastructure SILK has been rebuilding and regenerating."
Tempest Grove: "A lush, stormy ocean world, devastated by the NMVI.00 virus, which killed more than 117,000 here."
Trotsky: "Home of the Red Planet Initiative and of its radical breakaway faction, Deep Red."
Typhon's Maw: "Host to major shipyards."
Unison: "An LGR world invaded by Terran forces in Turn 11, causing significant civilian casualties."
Ur-Lucent: "Formerly designated X17, this M-Class world was settled by the Seekers Commonwealth in Turn 10 under its Direct Investment Colonial Kickstart programme."
Usagi: "An SNG world with ecologically protected territories and a great biosphere, now home to refugees from Monokoke and Y5."
Vándor: "A space Iceland."
Venta: "A divided world where the Northern Democratic Colonial Authority faces the Dawnstar Colony and a breakaway district around Hoka Crater. Terran forces bombarded its northern desert in Turn 7."
Warden: "An AFCO colony."
Y15: "A colony shared by the Freedom Matters Commonwealth and the New Ketala Colonial Authority. Its orbital refinery burned up in the atmosphere after a pirate attack."
Y5: "A domed world of the Benzhar Hegemony, set among barren wastes, damaged in the Andor emergency and being rebuilt with SNG help."
Æsveera: "An Alarian world whose capital is Beorn, struck by a major terror attack in Turn 7."
